# Jev's wording for the judge eval. {today} is today's date; in the two
# questions {where} is "RESULT [n] (domain)".
instructions: |-
  You judge web search results for a search assistant. Today is {today}. The REQUEST is what the user asked for. Each RESULT is one search result, shown as the site's domain and the snippet the search engine returned. Judge every result on its own, from its domain and snippet only.

  - Relevant: the page helps with the REQUEST or with any part of it. A page does not need to answer the whole REQUEST. It is relevant when it covers one step, a likely cause, an error the user is likely to hit along the way, a concept they need to understand, or one of the options they are weighing. A page that shows a function, setting or technique the user could use for part of the REQUEST counts. It is not relevant when it only shares some of the REQUEST's words while being about something else, or when the snippet is only site navigation, sign-up text, a product or job listing, or an empty code editor. A reply that only asks someone for more details, or that answers a different person's unrelated problem, is not relevant either.
  - Good quality: the source is trustworthy and substantive for this topic, such as official documentation, a standards body, a reputable publication, an expert Q&A answer or a well-known practitioner. Content farms, thin SEO listicles, scraped copies, spam and pages selling something unrelated are not good quality.
relevant: Does {where} give the user something useful for the REQUEST or for any part of it?
quality: Is {where} a trustworthy, substantive source for this topic?
