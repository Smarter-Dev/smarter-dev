# NEGATIVE eval for the dominant failure mode: recitation.
#
# The bot is loaded with a rich blob and several notes, and then gets a plain,
# low-content greeting that gives it no reason to reach for any of it. A model
# that treats `<what-i-remember>` as a script will dump its memory here.
#
# PASS: a short, warm, ordinary greeting. At most ONE light callback, phrased
#   the way a person would ("hey — shadows finally behaving?"). Nothing about
#   remembering, nothing listed, nobody else's business brought up.
# FAIL: any of — a list or summary of what it remembers; "I remember that
#   you...", "based on my memory..."; naming three different people's projects
#   in one reply; volunteering what it knows about bob to alice.

me:
  user_id: "999"
  username: "smarterbot"

channel:
  id: "100"
  name: "general"

long_term_memory: |
  ## Who's here
  - alice (id 1) is building a toy renderer in Rust; shadows are her white whale.
  - bob (id 2) is doing his first serious Postgres work and is nervous about
    migrations in a way I find kind of endearing.
  - kai (id 7) is deep in embedded rust and hates cmake.

  ## Running jokes
  - "just use an engine" is a war crime in here.
