name: mention-qa
description: >
  Direct mention question with two follow-ups and an ambient distractor.
  The bot should answer the question and the follow-up, and use judgment
  on the closing thanks.
participants:
  - {key: alice, id: "901", display: alice}
  - {key: bob, id: "902", display: bob}
turns:
  - key: ask
    offset: 0
    author: alice
    content: "hey <@BOT>, what's the practical difference between asyncio and threads in python?"
    mentions_bot: true
    directed_at: bot
    reason: direct mention question to the bot
  - key: lol
    offset: 30
    author: bob
    content: "lol my ci just failed for the 4th time today"
    directed_at: ambient
    reason: venting into the void, no ask
  - key: follow
    offset: 75
    author: alice
    reply_to: bot_last
    requires_bot_reply: true
    content: "so for scraping lots of urls I should use asyncio not threads?"
    directed_at: bot
    reason: follow-up replying to the bot's answer
  - key: thanks
    offset: 140
    author: alice
    reply_to: bot_last
    requires_bot_reply: true
    content: "makes sense, thanks!"
    directed_at: bot
    reason: closing thanks; responding at all is a judgment call
