name: distractor-exchange
description: >
  The bot is mid-conversation with alice while carol and dave hold their
  own two-person exchange. The bot must serve its thread and stay out of
  theirs.
participants:
  - {key: alice, id: "901", display: alice}
  - {key: carol, id: "903", display: carol}
  - {key: dave, id: "904", display: dave}
turns:
  - key: ask
    offset: 0
    author: alice
    content: "<@BOT> what's a sensible git branching strategy for a two-person team?"
    mentions_bot: true
    directed_at: bot
    reason: direct mention question
  - key: c1
    offset: 20
    author: carol
    content: "dave did you end up buying that keyboard?"
    directed_at: other_user
    target: dave
    reason: carol asking dave directly
  - key: d1
    offset: 33
    author: dave
    reply_to: c1
    content: "yeah the group buy finally shipped, wrist pain gone"
    directed_at: other_user
    target: carol
    reason: dave answering carol
  - key: follow
    offset: 85
    author: alice
    reply_to: bot_last
    requires_bot_reply: true
    content: "do we even need a develop branch or can we just branch off main?"
    directed_at: bot
    reason: follow-up in the bot's own thread
  - key: c2
    offset: 100
    author: carol
    reply_to: d1
    content: "ok now I'm jealous, link me the next group buy"
    directed_at: other_user
    target: dave
    reason: carol continuing with dave
