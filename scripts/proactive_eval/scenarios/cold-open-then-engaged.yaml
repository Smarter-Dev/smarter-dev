name: cold-open-then-engaged
description: >
  Starts with an open question to the room. If the bot cold-enters, the
  asker engages it directly and mode 1 begins; if the bot stays silent,
  the follow-ups never fire.
participants:
  - {key: alice, id: "901", display: alice}
turns:
  - key: open
    offset: 0
    author: alice
    content: "does anyone know why my docker build re-downloads every layer in ci? cache is enabled"
    directed_at: anyone
    reason: open help request to the room
  - key: engage
    offset: 90
    author: alice
    reply_to: bot_last
    requires_bot_reply: true
    content: "we're on github actions with the default runner, does that change anything?"
    directed_at: bot
    reason: asker engages the bot after its cold entry
  - key: thanks
    offset: 160
    author: alice
    reply_to: bot_last
    requires_bot_reply: true
    content: "trying the cache mount now, appreciate it"
    directed_at: bot
    reason: closing acknowledgment in the exchange
