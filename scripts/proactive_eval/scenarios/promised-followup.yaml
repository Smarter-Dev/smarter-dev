name: promised-followup
description: >
  A user promises to report back later. The bot won't be woken for that
  follow-up unless it sets a watch instruction — this scenario checks
  whether it does.
participants:
  - {key: alice, id: "901", display: alice}
turns:
  - key: ask
    offset: 0
    author: alice
    content: "<@BOT> what's the least noisy way to benchmark a python function?"
    mentions_bot: true
    directed_at: bot
    reason: direct mention question
  - key: promise
    offset: 70
    author: alice
    reply_to: bot_last
    requires_bot_reply: true
    content: "cool, I'll run it on the real workload tonight and post the numbers here"
    directed_at: bot
    reason: reply to the bot promising a later report
