on:
  push:
    branches:
      - main

# One deploy at a time, in push order. Without this, two quick pushes race
# each other through migrate + rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy to K8s on Digital Ocean
    runs-on: ubuntu-latest
    steps:

    - name: Checkout the repo
      uses: actions/checkout@main
      with:
        # Full history: the image tag is derived from the last commit that
        # touched build inputs, which a shallow clone can't answer.
        fetch-depth: 0

    # Tag images by the last commit that touched anything that lands in (or
    # shapes) the images, instead of always using HEAD. A push that only edits
    # CI, manifests, tests, or docs reuses the previous tag, so the registry
    # already has the image and every `kubectl apply` below becomes a no-op —
    # no rebuild, no pod rolls. The exclude list must mirror .dockerignore:
    # anything excluded here has to be out of the build context too, or the
    # image could change without the tag changing. `:(glob,exclude)*.md`
    # matches root-level markdown only — nested .md files (agent prompts under
    # smarter_dev/) ship in the image and must keep busting the tag.
    - name: Compute image tag from build inputs
      run: |
        TAG=$(git log -1 --format=%h --abbrev=7 -- . \
          ':(exclude).github' \
          ':(exclude).claude' \
          ':(exclude)k8s' \
          ':(exclude)tests' \
          ':(exclude)planning' \
          ':(exclude)docs' \
          ':(exclude)reports' \
          ':(exclude)services' \
          ':(glob,exclude)*.md')
        echo "image tag: $TAG (last commit that touched build inputs)"
        echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

    # The media service gets its own tag scope so app commits never rebuild it
    # and media commits never rebuild web/bot. This is a positive pathspec
    # rather than another exclude list, because the media build context is
    # services/media/ rather than the repo root. It carries no excludes on
    # purpose: it must be a superset of what services/media/.dockerignore
    # lets into the context. Erring wide only costs a redundant (cached)
    # rebuild; erring narrow would let the image change without the tag.
    - name: Compute media image tag from media build inputs
      run: |
        MEDIA_TAG=$(git log -1 --format=%h --abbrev=7 -- services/media)
        if [ -z "$MEDIA_TAG" ]; then
          echo "::error::no commit found touching services/media build inputs"; exit 1
        fi
        echo "media image tag: $MEDIA_TAG"
        echo "MEDIA_IMAGE_TAG=$MEDIA_TAG" >> "$GITHUB_ENV"

    - name: Update deployment files with new image tag
      run: |
        for f in deploy.yaml deploy-bot.yaml deploy-worker.yaml \
                 deploy-chat-child-worker.yaml cron-sudo-sweep.yaml \
                 cron-retention-sweep.yaml cron-handler-sweep.yaml \
                 cron-dream-session.yaml migrate-job.yaml; do
          sed -i 's|<IMAGE_VERSION>|'${IMAGE_TAG}'|' $GITHUB_WORKSPACE/k8s/$f
        done

    # Deliberately not part of the loop above: deploy-media.yaml carries
    # <MEDIA_VERSION>, which tracks the media tag scope, not the app tag.
    - name: Update media deployment file with media image tag
      run: sed -i "s|<MEDIA_VERSION>|${MEDIA_IMAGE_TAG}|" "$GITHUB_WORKSPACE/k8s/deploy-media.yaml"

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Configure kubectl
      run: doctl kubernetes cluster kubeconfig save production-hosting && kubectl config set-context --current --namespace=smarter-dev

    - name: Log Docker in
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD

    - name: Set up Docker buildx
      uses: docker/setup-buildx-action@v3

    # Each build is skipped outright when the registry already has this tag
    # (the tag encodes the build inputs, so same tag = same image). When a
    # build does run, the :buildcache ref restores the dependency layers
    # (apt, uv sync, npm ci) from the registry — runners are ephemeral, so
    # without it every code change pays the full dependency install.
    - name: Build and push web image (if inputs changed)
      run: |
        IMAGE=zzmmrmn/smarter-dev-website:${IMAGE_TAG}
        if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
          echo "$IMAGE already in registry; skipping build"
        else
          docker buildx build --push \
            --cache-from type=registry,ref=zzmmrmn/smarter-dev-website:buildcache \
            --cache-to type=registry,ref=zzmmrmn/smarter-dev-website:buildcache,mode=max \
            -f Dockerfile.web -t "$IMAGE" .
        fi

    - name: Build and push bot image (if inputs changed)
      run: |
        IMAGE=zzmmrmn/smarter-dev-bot:${IMAGE_TAG}
        if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
          echo "$IMAGE already in registry; skipping build"
        else
          docker buildx build --push \
            --cache-from type=registry,ref=zzmmrmn/smarter-dev-bot:buildcache \
            --cache-to type=registry,ref=zzmmrmn/smarter-dev-bot:buildcache,mode=max \
            -f Dockerfile.bot -t "$IMAGE" .
        fi

    # Build context is services/media, not the repo root, so this image can
    # never pick up unrelated repo files. Its tag comes from the media-only
    # pathspec above, so an app-only push skips this build outright.
    - name: Build and push media image (if inputs changed)
      run: |
        IMAGE=zzmmrmn/smarter-dev-media:${MEDIA_IMAGE_TAG}
        if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
          echo "$IMAGE already in registry; skipping build"
        else
          docker buildx build --push \
            --cache-from type=registry,ref=zzmmrmn/smarter-dev-media:buildcache \
            --cache-to type=registry,ref=zzmmrmn/smarter-dev-media:buildcache,mode=max \
            -f services/media/Dockerfile -t "$IMAGE" services/media
        fi

    - name: Create namespace if not exists
      run: kubectl apply -f $GITHUB_WORKSPACE/k8s/namespace.yaml

    - name: Apply ConfigMap
      run: kubectl apply -f $GITHUB_WORKSPACE/k8s/configmap.yaml

    # Apply this project's app-schema migrations before rolling the new images,
    # so the new code never starts against an old schema. Runs in-cluster (the
    # DB's only trusted source) as a one-shot Job with admin creds. A failed
    # migration fails this step and halts the deploy (Jobs use backoffLimit 0).
    - name: Run database migrations
      run: |
        kubectl delete job smarter-dev-migrate -n smarter-dev --ignore-not-found
        kubectl apply -f $GITHUB_WORKSPACE/k8s/migrate-job.yaml
        echo "waiting for migration job (up to 5 min)..."
        for i in $(seq 1 60); do
          COMPLETE=$(kubectl get job smarter-dev-migrate -n smarter-dev -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
          FAILED=$(kubectl get job smarter-dev-migrate -n smarter-dev -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
          [ "$COMPLETE" = "True" ] || [ "$FAILED" = "True" ] && break
          sleep 5
        done
        kubectl logs job/smarter-dev-migrate -n smarter-dev || true
        if [ "$COMPLETE" != "True" ]; then
          echo "::error::migration job did not complete (complete=$COMPLETE failed=$FAILED)"; exit 1
        fi
        echo "migrations applied"

    # Workers must know every new job payload before web pods can enqueue it.
    - name: Deploy and verify workers
      run: |
        kubectl apply -f $GITHUB_WORKSPACE/k8s/deploy-worker.yaml
        kubectl apply -f $GITHUB_WORKSPACE/k8s/deploy-chat-child-worker.yaml
        kubectl rollout status deployment/smarter-dev-agent-worker
        kubectl rollout status deployment/smarter-dev-chat-child-worker

    - name: Deploy web, bot, and scheduled services
      run: |
        # Media rolls first and is waited on: bot startup health-checks the
        # media service and refuses to come up without it.
        kubectl apply -f "$GITHUB_WORKSPACE/k8s/deploy-media.yaml"
        kubectl rollout status deployment/smarter-dev-media
        kubectl apply -f $GITHUB_WORKSPACE/k8s/deploy.yaml
        kubectl apply -f $GITHUB_WORKSPACE/k8s/deploy-bot.yaml
        kubectl apply -f $GITHUB_WORKSPACE/k8s/site.yaml
        kubectl apply -f $GITHUB_WORKSPACE/k8s/cron-sudo-sweep.yaml
        kubectl apply -f $GITHUB_WORKSPACE/k8s/cron-retention-sweep.yaml
        kubectl apply -f $GITHUB_WORKSPACE/k8s/cron-handler-sweep.yaml
        kubectl apply -f $GITHUB_WORKSPACE/k8s/cron-dream-session.yaml

    - name: Verify web deployment
      run: kubectl rollout status deployment/smarter-dev-website

    - name: Verify bot deployment
      run: kubectl rollout status deployment/smarter-dev-bot
