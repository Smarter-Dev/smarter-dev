# One-shot DB migration job, run by the deploy workflow before rolling the new
# images. Runs in-cluster (the DB's only trusted source) with the *admin*
# (doadmin) direct connection, because migrations need DDL/ownership the app
# role lacks. Admin creds live in the `smarter-dev-migrate-secrets` secret
# (created out-of-band); every other env mirrors the web deployment so settings
# load identically. backoffLimit 0 = fail loud (a failed migration fails the
# deploy step and halts the rollout).
apiVersion: batch/v1
kind: Job
metadata:
  name: smarter-dev-migrate
  namespace: smarter-dev
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: smarter-dev-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: zzmmrmn/smarter-dev-website:<IMAGE_VERSION>
          workingDir: /app
          # Apply Skrift-core migrations (from the skrift installed in this
          # image), then this project's app-schema migrations, on the single
          # database (smarter-dev, skrift schema). Core runs first: a Skrift
          # upgrade can add worker columns that the new code needs before any
          # pod starts (0.2.1a1 adds worker_queue.claim_generation). The core
          # step loads Skrift's app.yaml, so every variable it interpolates is
          # set below.
          command: ["sh", "-c", "PYTHONPATH=/app uv run --no-sync python scripts/migrate.py --only skrift-main --only main"]
          envFrom:
            - configMapRef:
                name: smarter-dev-config
          env:
            # The DB URL uses the admin (doadmin) direct connection — DDL needs it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-migrate-secrets
                  key: database-url
            # Everything else mirrors the web deployment so settings load.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: redis-url
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: api-secret-key
            - name: WEB_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: web-session-secret
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: secret-key
            # Interpolated by Skrift's app.yaml, which the core step loads.
            - name: DISCORD_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: discord-application-id
            - name: DISCORD_APPLICATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: discord-client-secret
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: github-client-secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: google-client-secret
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: spaces-access-key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: spaces-secret-key
