# One-shot DB migration job, run by the deploy workflow before rolling the new
# images. Runs in-cluster (the DB's only trusted source) with the *admin*
# (doadmin) direct connection, because migrations need DDL/ownership the app
# role lacks. Admin creds live in the `smarter-dev-migrate-secrets` secret
# (created out-of-band); every other env mirrors the web deployment so settings
# load identically. backoffLimit 0 = fail loud (a failed migration fails the
# deploy step and halts the rollout).
apiVersion: batch/v1
kind: Job
metadata:
  name: smarter-dev-migrate
  namespace: smarter-dev
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      annotations:
        smarter.dev/identity-key-version: <IDENTITY_KEY_VERSION>
      labels:
        app: smarter-dev-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: zzmmrmn/smarter-dev-website:<IMAGE_VERSION>
          workingDir: /app
          # Apply Skrift-core migrations (from the skrift installed in this
          # image), then this project's app-schema migrations, on the single
          # database (smarter-dev, skrift schema). Core runs first: a Skrift
          # upgrade can add worker columns that the new code needs before any
          # pod starts (0.2.1a1 adds worker_queue.claim_generation). The core
          # step loads Skrift's app.yaml, so every variable it interpolates is
          # set below.
          command: ["sh", "-c", "PYTHONPATH=/app uv run --no-sync python scripts/migrate_and_pin_identity.py"]
          envFrom:
            - configMapRef:
                name: smarter-dev-config
          env:
            - name: SITE_IDENTITY_ROLLOUT_PHASE
              valueFrom:
                configMapKeyRef:
                  name: site-identity-rollout
                  key: phase
            # Trusted post-migration pin uses the SAME key as every deletion writer.
            - name: SITE_IDENTITY_FENCE_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: site-identity-fence-key
            - name: JSGALT
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: jsgalt
                  optional: false
            # The DB URL uses the admin (doadmin) direct connection — DDL needs it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-migrate-secrets
                  key: database-url
            # Everything else mirrors the web deployment so settings load.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: redis-url
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: api-secret-key
            - name: QT9YEP
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: qt9yep
                  optional: false
            - name: WEB_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: web-session-secret
            - name: URH8MJ
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: urh8mj
                  optional: false
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: secret-key
            - name: AOR1KG
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: aor1kg
                  optional: false
            # Interpolated by Skrift's app.yaml, which the core step loads.
            - name: DISCORD_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: discord-application-id
            - name: DISCORD_APPLICATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: discord-client-secret
            - name: SYJN54
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: syjn54
                  optional: false
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: github-client-secret
            - name: RLOJVC
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: rlojvc
                  optional: false
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: google-client-secret
            - name: ZVHJYO
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: zvhjyo
                  optional: false
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: spaces-access-key
            - name: RY7CUN
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: ry7cun
                  optional: false
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: spaces-secret-key
            - name: IJ2XAT
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: ij2xat
                  optional: false
