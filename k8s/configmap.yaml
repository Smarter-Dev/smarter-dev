---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smarter-dev-config
  namespace: smarter-dev
data:
  # Environment configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  
  # Web server configuration
  WEB_HOST: "0.0.0.0"
  WEB_PORT: "8000"
  
  # Skrift CMS environment
  SKRIFT_ENV: "production"

  # Discord OAuth redirect URI
  DISCORD_REDIRECT_URI: "https://smarter.dev/bot-admin/auth/discord/callback"
  
  # Rate limiting configuration
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"
  
  # Bot API configuration
  API_BASE_URL: "http://smarter-dev-website:8000/api"

  # Proactive-agent extraction rollout. Keep global ownership embedded until a
  # shadow guild has been validated, then move guild IDs through shadow and
  # external before changing the global default.
  PROACTIVE_AGENT_EXECUTION_MODE: "embedded"
  PROACTIVE_AGENT_SHADOW_GUILD_IDS: ""
  PROACTIVE_AGENT_EXTERNAL_GUILD_IDS: "733364234141827073,644299523686006834"
  PROACTIVE_AGENT_EMBEDDED_GUILD_IDS: ""
  # Claude Opus 5.5 on the direct Anthropic key since 2026-10-17 (#199); read by
  # the bot's embedded guilds and the proactive-agent deployment alike.
  PROACTIVE_AGENT_MODEL: "claude-opus-5-5"
  PROACTIVE_WATCHER_MODEL: "typesafe:jev-1.13.0"
  PROACTIVE_SKIM_MODEL: "z-ai/glm-5.3-flash"

  # Public pages keep their canonical, OG and policy links on the public host.
  SITE_BASE_URL: "https://smarter.dev"
  # Explicit billing-only preview opt-in; does not change global/public links.
  SITE_BILLING_ALLOWED_ORIGINS: '["https://smarter.dev", "https://next.smarter.dev"]'
  # Keep Python-owned links on the current host; flip to https://admin.smarter.dev at cutover (#123).
  ADMIN_BASE_URL: "https://smarter.dev"

  # Internal media service (LaTeX, audio transcode, cards). ClusterIP DNS name
  # from k8s/deploy-media.yaml; no trailing slash. The matching MEDIA_API_KEY is
  # a secret, wired per-deployment.
  MEDIA_SERVICE_URL: "http://smarter-dev-media:8080"
  MEDIA_REQUEST_TIMEOUT_SECONDS: "15"

  # LLM Model Configuration. The agent vars are catalog wire ids. Chat runs on
  # GPT-6 Luna from OpenAI directly (2026-09-24); everything else that ran on
  # Luna, compaction included, moved to Claude Haiku 5.5 on the direct
  # Anthropic key on 2026-10-17 (#199).
  CHAT_AGENT_MODEL: "gpt-6-luna"
  CHAT_AGENT_COMPACT_MODEL: "claude-haiku-5-5"
  HANDLER_AGENT_MODEL: "claude-haiku-5-5"

  # Discord voice message configuration
  VOICE_TTS_MODEL: "gemini-2.5-flash-preview-tts"
  VOICE_TTS_VOICE: "Kore"
  VOICE_TTS_SAMPLE_RATE: "24000"
  VOICE_TTS_CHANNELS: "1"
  VOICE_TTS_SAMPLE_WIDTH: "2"
  VOICE_MAX_INPUT_CHARS: "800"
  VOICE_WORDS_PER_MINUTE: "150"
  VOICE_MAX_DURATION_SECONDS: "30"
  VOICE_OPUS_BITRATE: "48k"
