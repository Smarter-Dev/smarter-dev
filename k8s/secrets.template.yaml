# Kubernetes Secrets Template
# This file shows the structure of secrets needed for the application.
# Replace ALL values with actual secrets before applying to cluster.

apiVersion: v1
kind: Secret
metadata:
  name: smarter-dev-secrets
  namespace: smarter-dev
type: Opaque
stringData:
  # Database Configuration
  database-url: "postgresql+asyncpg://username:password@hostname:5432/database"
  redis-url: "redis://:password@hostname:6379/0"

  # IDs and analytics (not credentials, stored plain)
  discord-application-id: "YOUR_DISCORD_APPLICATION_ID_HERE"
  discord-client-id: "YOUR_DISCORD_CLIENT_ID_HERE"
  github-client-id: "YOUR_GITHUB_CLIENT_ID_HERE"
  google-client-id: "YOUR_GOOGLE_CLIENT_ID_HERE"
  google-analytics-id: "G-XXXXXXXXXX"

  # --- Credentials: opaque keys only (see smarter_dev/shared/credentials.py).
  # The env var is the key uppercased; every value is the ENCODED form, never
  # the raw secret:
  #   printf %s "$RAW" | python -m smarter_dev.shared.credentials encode
  # Plain keys such as openai-api-key or discord-bot-token are no longer read
  # by any manifest. Notes on what each one holds:
  #   jsgalt  site identity fence key: 32+ high-entropy characters, stable
  #           forever, provisioned through the restricted secret manager with no
  #           usable placeholder (a missing key must block rollout). Never
  #           derive or rotate it with API or session keys; see
  #           docs/site-identity.md.
  #   fb3osy  bot Skrift API key (sk_...)
  #   tb0r54  site service principal key (sk_..., service_name=site,
  #           site-memory/site-privacy scopes; see docs/admin-host.md)
  #   fuc9ha  standalone proactive-agent key (distinct Skrift key with the
  #           bot-api permission, rotated independently of the bot)
  #   hvth7t  media service bearer token between bot and media pods
  #           (`mk_` + `openssl rand -hex 32`)
  kmsvp8: "v1.ENCODED_ANTHROPIC"
  irbckr: "v1.ENCODED_OPENAI"
  in8oid: "v1.ENCODED_GEMINI"
  rcgw3a: "v1.ENCODED_OPENROUTER"
  dawtiy: "v1.ENCODED_TYPESAFE"
  idndwl: "v1.ENCODED_JINA"
  ao6hue: "v1.ENCODED_BRAVE_SEARCH"
  wfz62p: "v1.ENCODED_YOUTUBE"
  qmh07u: "v1.ENCODED_RESEND"
  sikl1v: "v1.ENCODED_POLAR_ACCESS_TOKEN"
  yhvxcy: "v1.ENCODED_POLAR_WEBHOOK_SECRET"
  lhb3u8: "v1.ENCODED_STRIPE_SECRET_KEY"
  um6hk8: "v1.ENCODED_STRIPE_WEBHOOK_SECRET"
  pb9fqn: "v1.ENCODED_LOGFIRE"
  ry7cun: "v1.ENCODED_SPACES_ACCESS_KEY"
  ij2xat: "v1.ENCODED_SPACES_SECRET_KEY"
  fhi1ot: "v1.ENCODED_DISCORD_BOT_TOKEN"
  syjn54: "v1.ENCODED_DISCORD_CLIENT_SECRET"
  rlojvc: "v1.ENCODED_GITHUB_CLIENT_SECRET"
  zvhjyo: "v1.ENCODED_GOOGLE_CLIENT_SECRET"
  qt9yep: "v1.ENCODED_API_SECRET_KEY"
  fb3osy: "v1.ENCODED_BOT_API_KEY"
  hvth7t: "v1.ENCODED_MEDIA_API_KEY"
  fuc9ha: "v1.ENCODED_PROACTIVE_AGENT_API_KEY"
  tb0r54: "v1.ENCODED_SITE_API_KEY"
  jsgalt: "v1.ENCODED_SITE_IDENTITY_FENCE_KEY"
  aor1kg: "v1.ENCODED_SECRET_KEY"
  urh8mj: "v1.ENCODED_WEB_SESSION_SECRET"
  hdeagj: "v1.ENCODED_ADMIN_PASSWORD"

---
# Optional: Sentry configuration for error tracking
apiVersion: v1
kind: Secret
metadata:
  name: smarter-dev-monitoring
  namespace: smarter-dev
type: Opaque
stringData:
  sentry-dsn: "YOUR_SENTRY_DSN_HERE"
