# One-off Job: scripts/update_extension_install.py (#242). Not applied by the
# deploy workflow; run by hand with the deployed website tag, `check` first
# (read only), then `update`. For Rejoin Alert v1 -> v2:
#   <ARGS> = "check --guild 644299523686006834 --slug rejoin-alert"     (read only)
#   <ARGS> = "update --guild 644299523686006834 --slug rejoin-alert"
#   sed -e 's|<IMAGE_VERSION>|<tag>|' -e 's|<NAME>|check|' -e 's|<ARGS>|check --guild 644299523686006834 --slug rejoin-alert|' \
#     k8s/oneoff-update-extension-install.yaml | kubectl apply -f -
#   kubectl -n smarter-dev wait --for=condition=complete --timeout=120s job/smarter-dev-update-extension-install-check
#   kubectl -n smarter-dev logs job/smarter-dev-update-extension-install-check
#   kubectl -n smarter-dev delete job smarter-dev-update-extension-install-check
# Then the same four commands with <NAME> = update and
# <ARGS> = "update --guild 644299523686006834 --slug rejoin-alert". Running
# `update` again prints "nothing to update" and exits 0.
# Exit status 2 (the Job fails) means refused: nothing was changed.
apiVersion: batch/v1
kind: Job
metadata:
  name: smarter-dev-update-extension-install-<NAME>
  namespace: smarter-dev
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: smarter-dev-update-extension-install
    spec:
      restartPolicy: Never
      containers:
        - name: update-extension-install
          image: zzmmrmn/smarter-dev-website:<IMAGE_VERSION>
          workingDir: /app
          command: ["sh", "-c", "PYTHONPATH=/app uv run --no-sync python scripts/update_extension_install.py <ARGS>"]
          envFrom:
            - configMapRef:
                name: smarter-dev-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: database-url
