---
# Chat child-worker tier: a standalone Skrift worker process that drains the
# shared 'chat-subagents' queue and executes every agent/LLM job out-of-process,
# off the web tier. Runs the WEB image (it imports smarter_dev.web.* agent
# handler modules and needs the pydantic-ai/google-genai/openai stack), but
# starts the worker CLI instead of the HTTP server. Pairs with
# `workers.preset: distributed` (execution: out_of_process) in app.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: smarter-dev-chat-child-worker
    namespace: smarter-dev
    labels:
        app: smarter-dev-chat-child-worker
spec:
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app: smarter-dev-chat-child-worker
            tier: backend
    replicas: 1
    template:
        metadata:
            labels:
                app: smarter-dev-chat-child-worker
                tier: backend
        spec:
            containers:
              - name: chat-child-worker
                image: zzmmrmn/smarter-dev-website:<IMAGE_VERSION>
                # Drain only durable Chat child jobs. Redis fencing remains the
                # cross-pod hard-five concurrency authority.
                command: ["/app/.venv/bin/python", "-m", "smarter_dev.shared.skrift_secrets", "workers", "run", "--queue", "chat-subagents", "--concurrency", "5"]
                envFrom:
                  - configMapRef:
                      name: smarter-dev-config
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: database-url
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: redis-url
                  - name: QT9YEP
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: qt9yep
                        optional: false
                  - name: URH8MJ
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: urh8mj
                        optional: false
                  - name: AOR1KG
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: aor1kg
                        optional: false
                  # Object storage (DigitalOcean Spaces) — app.yaml's
                  # storage.stores.default.s3 block interpolates these at
                  # config-load time, so the process won't boot without them.
                  - name: RY7CUN
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: ry7cun
                        optional: false
                  - name: IJ2XAT
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: ij2xat
                        optional: false
                  # Auth provider creds — app.yaml's auth config interpolates
                  # these at load time, so config parsing fails without them.
                  - name: DISCORD_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: discord-client-id
                  - name: SYJN54
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: syjn54
                        optional: false
                  - name: DISCORD_APPLICATION_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: discord-application-id
                  - name: FHI1OT
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: fhi1ot
                        optional: false
                  - name: GITHUB_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: github-client-id
                  - name: RLOJVC
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: rlojvc
                        optional: false
                  - name: GOOGLE_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: google-client-id
                  - name: ZVHJYO
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: zvhjyo
                        optional: false
                  # LLM providers used by the agents executed here.
                  - name: IN8OID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: in8oid
                        optional: false
                  - name: IRBCKR
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: irbckr
                        optional: false
                  - name: KMSVP8
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: kmsvp8
                        optional: false
                  - name: RCGW3A
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: rcgw3a
                        optional: false
                  - name: PB9FQN
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: pb9fqn
                        optional: true
                  - name: LOGFIRE_SERVICE_NAME
                    value: "smarter-dev-agent-worker"
                  - name: LOGFIRE_SERVICE_VERSION
                    value: "<IMAGE_VERSION>"
                  - name: SIKL1V
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: sikl1v
                        optional: false
                  - name: POLAR_SERVER
                    value: "production"
                  # Research/blogging agent tool credentials.
                  - name: IDNDWL
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: idndwl
                        optional: false
                  - name: AO6HUE
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: ao6hue
                        optional: false
                  - name: WFZ62P
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: wfz62p
                        optional: false
                  - name: QMH07U
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: qmh07u
                        optional: false
                  - name: SKRIFT_ENV
                    value: "production"
                  # Memory sub-agents' run_code sandboxes may hold at once
                  # (code_sandbox.py): three 64 MiB runs plus Monty's 16
                  # each. Limit 1Gi, 364Mi in use (2026-10-24): worst ~604Mi.
                  - name: CODE_SANDBOX_BUDGET_MIB
                    value: "240"
                resources:
                    requests:
                        cpu: 100m
                        memory: 512Mi
                    limits:
                        cpu: "1"
                        memory: 1Gi
                # Liveness/readiness by process presence — the worker has no
                # HTTP port. Matches the bot's pgrep pattern.
                startupProbe:
                    exec:
                        command: ["sh", "-c", "grep -qa workers /proc/*/cmdline"]
                    failureThreshold: 30
                    periodSeconds: 10
                livenessProbe:
                    exec:
                        command: ["sh", "-c", "grep -qa workers /proc/*/cmdline"]
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                readinessProbe:
                    exec:
                        command: ["sh", "-c", "grep -qa workers /proc/*/cmdline"]
                    initialDelaySeconds: 10
                    periodSeconds: 10
                    timeoutSeconds: 3
                    failureThreshold: 2
            restartPolicy: Always
