---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: smarter-dev-website
    namespace: smarter-dev
    labels:
        app: smarter-dev-website
spec:
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1  # One extra pod at a time keeps roll surge to 192Mi
            maxUnavailable: 50%
    selector:
        matchLabels:
            app: smarter-dev-website
            tier: frontend
    replicas: 2  # Fixed; the site has no HPA
    template:
        metadata:
            annotations:
                smarter.dev/identity-key-version: <IDENTITY_KEY_VERSION>
            labels:
                app: smarter-dev-website
                tier: frontend
        spec:
            volumes:
              - name: identity-rollout
                configMap:
                  name: site-identity-rollout
                  items:
                    - key: phase
                      path: phase
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                  matchLabels:
                      app: smarter-dev-website
            containers:
              - name: starlette-site
                image: zzmmrmn/smarter-dev-website:<IMAGE_VERSION>
                ports:
                  - containerPort: 8000
                command: ["/app/.venv/bin/python", "-m", "scripts.identity_web_gate"]
                volumeMounts:
                  - name: identity-rollout
                    mountPath: /var/run/site-identity-rollout
                    readOnly: true
                envFrom:
                  - configMapRef:
                      name: smarter-dev-config
                env:
                  # Stable, independently managed deletion-fence key; never rotate
                  # with API/session keys. Pin before rolling these writers.
                  - name: JSGALT
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: jsgalt
                        optional: false
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: database-url
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: redis-url
                  - name: QT9YEP
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: qt9yep
                        optional: false
                  - name: URH8MJ
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: urh8mj
                        optional: false
                  - name: DISCORD_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: discord-client-id
                  - name: SYJN54
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: syjn54
                        optional: false
                  - name: DISCORD_APPLICATION_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: discord-application-id
                  - name: FHI1OT
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: fhi1ot
                        optional: false
                  - name: GOOGLE_ANALYTICS_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: google-analytics-id
                  - name: KMSVP8
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: kmsvp8
                        optional: false
                  - name: QMH07U
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: qmh07u
                        optional: false
                  - name: AOR1KG
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: aor1kg
                        optional: false
                  - name: IDNDWL
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: idndwl
                        optional: false
                  - name: AO6HUE
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: ao6hue
                        optional: false
                  # Jev decides whether a search link request is a web address.
                  - name: DAWTIY
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: dawtiy
                        optional: false
                  # Load Jev's SDK at startup so the first redirect after a deploy is fast.
                  - name: WEB_SEARCH_ADDRESS_WARM
                    value: "1"
                  - name: WFZ62P
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: wfz62p
                        optional: false
                  - name: IN8OID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: in8oid
                        optional: false
                  - name: IRBCKR
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: irbckr
                        optional: false
                  - name: RY7CUN
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: ry7cun
                        optional: false
                  - name: IJ2XAT
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: ij2xat
                        optional: false
                  - name: PB9FQN
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: pb9fqn
                        optional: true
                  - name: LOGFIRE_SERVICE_NAME
                    value: "smarter-dev-web"
                  - name: LOGFIRE_SERVICE_VERSION
                    value: "<IMAGE_VERSION>"
                  - name: SIKL1V
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: sikl1v
                        optional: false
                  - name: YHVXCY
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: yhvxcy
                        optional: false
                  # Polar environment. The polar-access-token / polar-webhook-secret
                  # secrets must belong to the matching Polar org (production here).
                  - name: POLAR_SERVER
                    value: "production"
                  - name: GITHUB_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: github-client-id
                  - name: RLOJVC
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: rlojvc
                        optional: false
                  - name: GOOGLE_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: google-client-id
                  - name: ZVHJYO
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: zvhjyo
                        optional: false
                  - name: SKRIFT_ENV
                    value: "production"
                  # Internal media service, used by the admin voice replay to
                  # transcode WAV to Ogg/Opus. MEDIA_SERVICE_URL comes from the
                  # config map; MediaClient refuses to build without both.
                  - name: HVTH7T
                    valueFrom:
                      secretKeyRef:
                        name: smarter-dev-secrets
                        key: hvth7t
                        optional: false
                  # The web pod runs no sandbox budget's worth of code: only
                  # the handler linter's parse (16 MiB cap plus ~10 MiB of
                  # Monty worker, outside it). Kept small so nothing run here
                  # by mistake can fill the pod (512Mi; 345-378Mi in use
                  # two hours after the 2026-10-24 19:49Z roll).
                  - name: CODE_SANDBOX_BUDGET_MIB
                    value: "32"
                # Limit 512Mi: the busier pod read 378Mi (343Mi RSS) two
                # hours after a roll, gaining ~5Mi an hour; with a lint parse
                # (~26Mi) and the budget (32Mi) at once that's ~436Mi, ~76Mi
                # under the limit (~15 h more growth). 384Mi left 6Mi. The
                # request stays 192Mi so scheduling is unchanged.
                resources:
                    requests:
                        cpu: 75m
                        memory: 192Mi
                    limits:
                        cpu: 300m
                        memory: 512Mi
                # A fresh pod needs ~100s to import the app at the 300m CPU
                # limit; without a startup budget the liveness probe kills it
                # at ~90s and the rollout flaps. The startup probe allows up
                # to 4 minutes, then the normal liveness cadence takes over.
                startupProbe:
                    httpGet:
                        path: /api/health
                        port: 8000
                    periodSeconds: 15
                    timeoutSeconds: 5
                    failureThreshold: 16
                livenessProbe:
                    httpGet:
                        path: /api/health
                        port: 8000
                    initialDelaySeconds: 30
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                readinessProbe:
                    httpGet:
                        path: /api/health
                        port: 8000
                    initialDelaySeconds: 10
                    periodSeconds: 10
                    timeoutSeconds: 3
                    failureThreshold: 2
