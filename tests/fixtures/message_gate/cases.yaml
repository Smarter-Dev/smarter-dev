# Labeled cases for the Discord message-gate quality eval
# (tests/integration/test_message_gate_quality_eval.py).
#
# Each case is one gate call:
#   id               unique case id
#   category         free-form grouping used in the eval report
#   instructions     the admin's response filter (INSTRUCTIONS)
#   channel_name     optional; for a forum post/thread this is its title
#   grounding        CONTEXT messages (oldest first) — never valid answers
#   candidates       messages the gate judges
#   expected_allowed candidate ids the filter should allow
#   either           optional; candidate ids where allow and drop are both
#                    acceptable (removed from both sides before scoring)
#   notes            optional; why the label is what it is
#
# Message ids are Discord-snowflake-shaped strings so the model has to copy
# ids of the same shape production sends. Labels follow message_gate.SYSTEM_PROMPT:
# drop plainly off-topic, allow borderline, judge redirects by the inherited
# topic, ignore the author, never return context ids.

cases:
  # ---------------------------------------------------------------- on_topic
